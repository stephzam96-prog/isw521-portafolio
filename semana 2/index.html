<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- HEADER con logo, nav y buscador -->
<header>
  <p><strong>Logo UTN</strong></p>

  <nav>
    <a href="#">Inicio</a>
    <a href="#">Cursos</a>
    <a href="#">Contacto</a>
  </nav>

  <!-- Formulario de búsqueda (requisito del profesor) -->
  <label for="busqueda">Buscar:</label>
  <input type="search" id="busqueda" placeholder="Buscar...">
  <button type="button">Buscar</button>
</header>

<!-- CONTENIDO PRINCIPAL: 3 columnas -->
<div style="display: flex; gap: 10px;">

  <!-- Columna izquierda: Filtros -->
  <aside>
    <h2>Filters</h2>
    <p>Filtro 1</p>
    <p>Filtro 2</p>
  </aside>

  <!-- Columna central: Contenido principal -->
  <main>
    <article>
      <h1>Título del Artículo</h1>
      <p>Este es el contenido principal de la página.</p>
    </article>
  </main>

  <!-- Columna derecha: Relacionados -->
  <aside>
    <h2>Related</h2>
    <p>Artículo relacionado 1</p>
    <p>Artículo relacionado 2</p>
  </aside>

</div>

<!-- FOOTER -->
<footer>
  <p>© UTN 2026</p>
</footer>
</body>
</html>
